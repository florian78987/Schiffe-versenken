<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Schiffe versenken</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f2f2f2;
    margin:0;
    padding:20px;
}

.container{
    max-width:400px;
    margin:auto;
}

.card{
    background:#0d5c86;
    color:white;
    border-radius:12px;
    padding:20px;
    margin-bottom:15px;
}

.card h3{
    margin-top:0;
}

select{
    width:100%;
    padding:12px;
    font-size:18px;
}

button{
    width:100%;
    padding:15px;
    background:#2e7d32;
    color:white;
    border:none;
    border-radius:12px;
    font-size:20px;
    cursor:pointer;
}

.info{
    margin-top:15px;
    background:#e67e22;
    color:white;
    padding:25px;
    border-radius:12px;
    text-align:center;
    font-size:24px;
    font-weight:bold;
}

.log{
    background:white;
    margin-top:15px;
    padding:15px;
    border-radius:12px;
    max-height:250px;
    overflow:auto;
}

.stats{
    text-align:center;
    margin-top:15px;
    font-size:20px;
    font-weight:bold;
}
</style>
</head>
<body>

<div class="container">

    <div class="card">
        <h3>Buchstabe</h3>
        <select id="letter"></select>
    </div>

    <div class="card">
        <h3>Zahl</h3>
        <select id="number"></select>
    </div>

    <button onclick="fire()">🚀 FEUERN</button>

    <div class="info" id="result">
        Bereit
    </div>

    <div class="stats">
        Versenkt: <span id="sunkCount">0</span> / 9
    </div>

    <div class="log" id="log"></div>

</div>

<script>

const letters = [
"A","I","T","J","B","U","K","L","C","V",
"D","M","E","W","X","O","P","Y","F","Q",
"Z","G","R","H","S"
];

const numbers = [
10,1,9,11,2,20,3,12,21,14,4,18,22,5,
23,13,24,6,15,25,7,16,17,26,19
];

const ships = {
1:["B-21","B-14"],
2:["M-9","M-11","M-2","M-20"],
3:["T-4","J-4","B-4","U-4","K-4","L-4"],
4:["E-9","W-9","X-9","O-9","P-9"],
5:["E-20","W-20","X-20","O-20","P-20"],
6:["Y-9","Y-11","Y-2","Y-20"],
7:["I-12","I-21","I-14","I-4"],
8:["X-11","X-2"],
9:["D-15","M-15","E-15","W-15","X-15","O-15"]
};

const hits = [];
const sunkShips = [];

const letterSelect = document.getElementById("letter");
const numberSelect = document.getElementById("number");

letters.forEach(letter => {
    letterSelect.innerHTML +=
    `<option value="${letter}">${letter}</option>`;
});

numbers.forEach(number => {
    numberSelect.innerHTML +=
    `<option value="${number}">${number}</option>`;
});

function fire(){

    const shot =
        letterSelect.value +
        "-" +
        numberSelect.value;

    if(hits.includes(shot)){
        document.getElementById("result").innerHTML =
        "⚠️ Bereits beschossen";
        return;
    }

    hits.push(shot);

    for(const shipId in ships){

        const ship = ships[shipId];

        if(ship.includes(shot)){

            let sunk = true;

            ship.forEach(pos=>{
                if(!hits.includes(pos)){
                    sunk = false;
                }
            });

            if(sunk){

                if(!sunkShips.includes(shipId)){
                    sunkShips.push(shipId);
                }

                document.getElementById("result").innerHTML =
                "🚢 VERSENKT!";

            }else{

                document.getElementById("result").innerHTML =
                "🎯 TREFFER!";
            }

            document.getElementById("sunkCount").innerHTML =
            sunkShips.length;

            document.getElementById("log").innerHTML =
            shot + " → " +
            document.getElementById("result").innerHTML +
            "<br>" +
            document.getElementById("log").innerHTML;

            return;
        }
    }

    document.getElementById("result").innerHTML =
    "❌ KEIN TREFFER";

    document.getElementById("log").innerHTML =
    shot + " → Kein Treffer<br>" +
    document.getElementById("log").innerHTML;
}

</script>

</body>
</html>
